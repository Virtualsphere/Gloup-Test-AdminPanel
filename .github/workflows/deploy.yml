name: Deploy Admin Panel (Prod)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy admin panel to production VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.ADMIN_PROD_DEPLOY_PATH }}"

            echo "Pulling latest production code..."
            git fetch origin
            git checkout master
            git pull origin master

            echo "Writing production build env..."
            printf '%s\n' \
              "VITE_API_BASE_URL=${{ secrets.ADMIN_PROD_API_BASE_URL }}" \
              "VITE_IMAGE_BASE_URL=${{ secrets.ADMIN_PROD_IMAGE_BASE_URL }}" \
              "VITE_GOOGLE_MAPS_KEY=${{ secrets.ADMIN_PROD_GOOGLE_MAPS_KEY }}" \
              "PORT=${{ secrets.ADMIN_PROD_PORT }}" \
              > .env

            echo "Building and starting admin panel..."
            docker compose --env-file .env up -d --build

            echo "Admin production deployment completed"
            docker compose ps
